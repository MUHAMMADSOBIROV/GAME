<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎈 Flappy Ball</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>🎈 Flappy Ball</h1>

        <div class="stats">
            <div class="stat-box">
                <span class="label">Hisob</span>
                <span id="score" class="value">0</span>
            </div>
            <div class="stat-box">
                <span class="label">Rekord</span>
                <span id="highScore" class="value">0</span>
            </div>
            <div class="stat-box">
                <span class="label">Daraja</span>
                <span id="level" class="value">1</span>
            </div>
        </div>

        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="400" height="600"></canvas>
            <div id="overlay" class="overlay">
                <h2 id="overlayTitle">Flappy Ball</h2>
                <p id="overlayText">Boshlash uchun bosing yoki SPACE tugmasini bosing</p>
                <button id="startBtn">Boshlash</button>
            </div>
        </div>

        <div class="controls">
            <button id="soundBtn" class="ctrl-btn">🔊 Ovoz</button>
            <button id="restartBtn" class="ctrl-btn">🔄 Qaytadan</button>
            <button id="clearRecordBtn" class="ctrl-btn danger">🗑 Rekord</button>
        </div>

        <div class="instructions">
            <p>Uchish: <strong>SPACE</strong>, <strong>↑</strong>, yoki <strong>sichqoncha</strong></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
